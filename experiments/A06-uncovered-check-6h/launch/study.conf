# A06: can the `uncovered` mutator do better with feedback on its own steps? Control is what A03 kept: `uncovered`
# in continuous mode. Two switches on top of it, each alone and both (g2fuzz/py_utils/uncovered.py):
# cond:  G2F_UNCOVERED_CONDITIONS=1. The prompt also names the conditions of the function that only ever went one way.
# check: G2F_UNCOVERED_CHECK=2. A new generator's files are run through the target's source-coverage build; if they
#        reach none of the marked lines the LLM is told so and asked again (at most 2 times). A function whose lines
#        were reached, or that failed 3 steps, is not picked again in the campaign.
# Same 15 targets, time, reps and model as A03; new shared seeds. Needs the lists made again with
# LISTS_ONLY=1 build/targets/build-uncovered.sh (they get the line numbers and conditions the switches read).
targets     = @targets.txt
arms        = uncovered-cont: set:G2F_LLM_MODE=continuous set:G2F_STALL_MUTATORS=uncovered
            | cond: set:G2F_LLM_MODE=continuous set:G2F_STALL_MUTATORS=uncovered set:G2F_UNCOVERED_CONDITIONS=1
            | check: set:G2F_LLM_MODE=continuous set:G2F_STALL_MUTATORS=uncovered set:G2F_UNCOVERED_CHECK=2
            | check-cond: set:G2F_LLM_MODE=continuous set:G2F_STALL_MUTATORS=uncovered set:G2F_UNCOVERED_CHECK=2 set:G2F_UNCOVERED_CONDITIONS=1
model       = gpt-oss-20b
scheduler   = random
secs        = 21600
reps        = 5
seeds       = shared
name        = {arm}/{target}-r{rep}
gpu         = qc-h100
account     = priority-quantumcore
partition   = priority
output      = campaign
