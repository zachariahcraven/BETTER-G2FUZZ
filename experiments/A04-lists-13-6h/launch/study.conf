# A04: the prior run that the `uncovered` mutator needs for the 13 paper targets A00 did not cover.
# The mutator shows the LLM functions that an earlier campaign entered but did not finish; that list
# (<targets>/<target>.uncovered.json) is made by build/targets/build-uncovered.sh from a campaign's queue.
# For A00's 15 targets the lists come from A00's control arm (6 h, 5 reps). This is the same for the other 13,
# with 2 reps: enough for the lists, not a comparison. No decision comes from this study.
targets     = @targets.txt
arms        = control:                                   # Alfred's defaults: feature, structure, pattern after a stall
model       = gpt-oss-20b
scheduler   = random
secs        = 21600
reps        = 2
seeds       = shared
name        = {arm}/{target}-r{rep}
gpu         = qc-h100
account     = priority-quantumcore
partition   = priority
output      = campaign
