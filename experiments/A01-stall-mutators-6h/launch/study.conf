# A01: which stall mutator. Stall steps that always target a feature no generator has yet, with the feature taken
# from the model (rare) or from documents found on the web at that stall (web), against upstream's mix; and the mix
# without pattern mutation (0.7 descendants per generator in 04, against 2.6-2.9 for feature and structure).
# One mutator per arm: a 6 h campaign has a median of 3 stall steps (03, gpt-oss-20b), so a mutator that is one of
# four random picks would run less than once per campaign. Seeds shared.
# Before launch: the control is A00's winner (its switches become the defaults in code, then a new image), and
# scripts/web-check passes on a priority-partition node (docs/ALFRED-ROUNDS.md, Friday checklist).
targets     = @targets.txt
arms        = control:
            | rare: set:G2F_STALL_MUTATORS=rare
            | web: set:G2F_STALL_MUTATORS=web
            | no-pattern: set:G2F_STALL_MUTATORS=feature+structure
model       = gpt-oss-20b
scheduler   = ucb
secs        = 21600
reps        = 5
seeds       = shared
name        = {arm}/{target}-r{rep}
gpu         = qc-h100
account     = priority-quantumcore
partition   = priority
output      = campaign
