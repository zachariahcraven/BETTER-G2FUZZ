# 05-model-sweep-qc-24h-nosched (README.md): 04's design, identical in every way but one: the generator scheduler
# is `random` (upstream G2FUZZ's pick) instead of `ucb` (this repo's). A clean scheduler-off baseline for 04.
#   scripts/study start 05-model-sweep-qc-24h-nosched --servers --background
targets     = @targets.txt
# Servers start in this order and 4 run at once, so the first four arms are round 1 and the next four round 2; each
# round mixes a large dense model, a small one, a code model and a mixture-of-experts one (README.md)
arms        = Qwen3.8-27B-FP8: --model Qwen3.8-27B-FP8
            | Llama-3.1-8B-Instruct: --model Llama-3.1-8B-Instruct
            | DeepSeek-Coder-V2-Lite-Instruct: --model DeepSeek-Coder-V2-Lite-Instruct
            | gpt-oss-20b: --model gpt-oss-20b
            | gemma-4-31B-it: --model gemma-4-31B-it
            | phi-4: --model phi-4
            | Mistral-Small-3.1-24B-Instruct-2503: --model Mistral-Small-3.1-24B-Instruct-2503
            | Seed-Coder-8B-Instruct: --model Seed-Coder-8B-Instruct
            | afl: --afl
# the one change from 04: upstream G2FUZZ's random generator pick, not this repo's ucb bandit
scheduler   = random
secs        = 86400
reps        = 5
seeds       = fresh          # each model generates its own seeds: part of what the study compares
name        = {arm}/{target}-r{rep}
max_seedgen = 4
# where it runs: the quantumcore group's H100s and CPUs, not the class's
gpu         = qc-h100
account     = priority-quantumcore
partition   = priority
# AFL++ writes its output into the campaign folders, not onto the nodes' shared disk (OURS-3; 04's README)
output      = campaign
