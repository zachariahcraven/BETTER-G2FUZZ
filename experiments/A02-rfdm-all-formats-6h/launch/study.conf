# A02: Rare-Feature Directed Mutation during seed generation for multi-format targets too (upstream and 03-05 run it
# for single-format targets only). A setup switch, so every campaign makes its own seeds (seeds = fresh), on the
# 4 multi-format targets of 03-05 only. Runs beside A01.
targets     = jhead gdk-pixbuf-pixdata imginfo sndfile_fuzzer
arms        = control:
            | rfdm-all: set:G2F_RFDM_ALL_FORMATS=1
model       = gpt-oss-20b
scheduler   = ucb
secs        = 21600
reps        = 5
seeds       = fresh
name        = {arm}/{target}-r{rep}
gpu         = qc-h100
account     = priority-quantumcore
partition   = priority
output      = campaign
