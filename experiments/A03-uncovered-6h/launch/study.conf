# A03: the confirmation round for the `uncovered` stall mutator (coverage feedback), with new seeds and from a cold
# start, as a campaign is really run: 6 h from freshly generated shared seeds, not A01's warm start.
# A01 (warm start, 2 h): uncovered beat afl-only on 11 of 15 targets (median ratio 1.013, Wilcoxon p = 0.003) and the
# blind mutators did not (p >= 0.5). The acceptance rule asks for one repeat with a new seed set before a keep.
# uncovered: stall mode as control, but every step is the uncovered mutator. uncovered-cont: one step after another.
# The uncovered lists are A01's: made from A00 control's queues after 6 h (<targets>/<target>.uncovered.json).
targets     = @targets.txt
arms        = control:                                   # Alfred's defaults: feature, structure, pattern after a stall
            | afl: --afl
            | uncovered: set:G2F_STALL_MUTATORS=uncovered
            | uncovered-cont: set:G2F_LLM_MODE=continuous set:G2F_STALL_MUTATORS=uncovered
model       = gpt-oss-20b
scheduler   = random
secs        = 21600
reps        = 5
seeds       = shared
name        = {arm}/{target}-r{rep}
gpu         = qc-h100
account     = priority-quantumcore
partition   = priority
output      = campaign
