# NN-short-name: the study's campaigns, launched by scripts/study (scripts/study help lists every setting).
#   scripts/study show  NN-short-name           check what this describes
#   scripts/study start NN-short-name --servers --dry          what start would launch
#   scripts/study start NN-short-name --servers --background   run everything, then: scripts/study status NN-short-name
#
# Example (replace it): does our UCB scheduler beat upstream's random pick, on 3 targets, 5 reps of 6 h?
targets     = jhead mp42aac pdftotext                         # or @targets.txt, one per line
arms        = ucb: --scheduler ucb
            | random: --scheduler random
reps        = 5
secs        = 21600
model       = Qwen3.8-27B-FP8
seeds       = shared      # one seed generation per target, reused by every arm: only the scheduler differs
name        = {target}-{arm}-r{rep}
