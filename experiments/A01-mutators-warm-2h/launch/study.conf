# A01: which stall mutator finds coverage that AFL++ can't reach on its own? A warm-start screen: each campaign starts
# where an A00 control campaign stalled after 6 h (its queue, generators and feature lists: seeds = warm) and runs LLM
# steps one after another (continuous) for 2 h: about 1,900 steps per arm, against about 450 in 6 h of stall mode.
# Every arm's rep r starts from A00's control/<target>-r<r>, so the arms are compared on the same starting points.
# afl-only: the same warm start with no LLM step (a plateau no run reaches): what AFL++ alone still finds there.
targets     = @targets.txt
arms        = control: set:G2F_LLM_MODE=continuous                       # feature, structure, pattern (upstream's mix)
            | rare: set:G2F_LLM_MODE=continuous set:G2F_STALL_MUTATORS=rare
            | web: set:G2F_LLM_MODE=continuous set:G2F_STALL_MUTATORS=web
            | no-pattern: set:G2F_LLM_MODE=continuous set:G2F_STALL_MUTATORS=feature+structure
            | afl-only: set:G2F_PLATEAU_SEC=1000000
model       = gpt-oss-20b
scheduler   = random
secs        = 7200
reps        = 5
seeds       = warm:../../A00-baseline-6h/campaigns/control/{target}-r{rep}
name        = {arm}/{target}-r{rep}
gpu         = qc-h100
account     = priority-quantumcore
partition   = priority
output      = campaign
