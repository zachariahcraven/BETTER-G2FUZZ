# 02-model-sweep (README.md): each model against the 15 targets.
# All of it:  scripts/study start 02-model-sweep --servers --background   (one model: add --only arm=<model>)
targets     = @targets.txt
# one arm per model that llm-serve.sbatch serves on one GPU (README.md, Tempest setup step 8)
arms        = Qwen3.8-27B-FP8: --model Qwen3.8-27B-FP8
            | phi-4: --model phi-4
            | starcoder2-15b-instruct-v0.1: --model starcoder2-15b-instruct-v0.1
            | DeepSeek-Coder-V2-Lite-Instruct: --model DeepSeek-Coder-V2-Lite-Instruct
            | Mistral-Small-3.1-24B-Instruct-2503: --model Mistral-Small-3.1-24B-Instruct-2503
scheduler   = ucb
secs        = 21600
reps        = 1
seeds       = fresh          # each model generates its own seeds: part of what the study compares
name        = {arm}/{target}-r{rep}
max_seedgen = 4
