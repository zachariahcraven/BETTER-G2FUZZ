# A00: Alfred's 6 h baseline on 03-05's 15 targets, plain AFL++ 5.03c (the no-LLM baseline), and two fuzz-time
# switches for when the LLM worker runs a step. Seeds shared: the G2FUZZ arms differ only in their switches.
# Before launch: set scheduler from study 05's result (ucb vs random, docs/ALFRED-ROUNDS.md, Phase B).
targets     = @targets.txt
arms        = control:                                   # Alfred's defaults: a step after 300 s without a find, +60 s each
            | afl: --afl
            | continuous: set:G2F_LLM_MODE=continuous    # one step after another, all run long
            | fast-stall: set:G2F_PLATEAU_SEC=120 set:G2F_BACKOFF_SEC=0
model       = gpt-oss-20b
scheduler   = ucb
secs        = 21600
reps        = 5
seeds       = shared
name        = {arm}/{target}-r{rep}
gpu         = qc-h100
account     = priority-quantumcore
partition   = priority
output      = campaign
