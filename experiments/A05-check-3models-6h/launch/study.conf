# A05: the check round (docs/ALFRED-ROUNDS.md, "When rounds end"): does what the rounds kept hold on three models
# and on all 28 paper targets, before the 24 h final study?
# Kept by the rounds: the `uncovered` mutator in continuous mode (A01: p = 0.003 against AFL++ alone from a warm
# start; A03: 12 better / 3 worse against control, p = 0.009, 15 targets, gpt-oss-20b) and the generator limits.
# Models: the three with the best mean rank in 04 (24 h, 15 targets): gpt-oss-20b 2.33, phi-4 3.93, Qwen3.8 4.60
# (Mistral-Small ties with Qwen3.8; Qwen3.8 is the team's reference model).
# Per model: <model>-control = Alfred as it was before the rounds (upstream's mutators after a stall);
#            <model>-alfred  = continuous mode, every step the uncovered mutator. Both start from the same seeds
#            (seeds = shared: one seed generation per model and target).
# The uncovered lists are the same for every model: made from gpt-oss-20b control queues (A00 and A04, 6 h).
targets     = @targets.txt
arms        = gpt-oss-20b-control: --model gpt-oss-20b
            | gpt-oss-20b-alfred:  --model gpt-oss-20b set:G2F_LLM_MODE=continuous set:G2F_STALL_MUTATORS=uncovered
            | phi-4-control:       --model phi-4
            | phi-4-alfred:        --model phi-4 set:G2F_LLM_MODE=continuous set:G2F_STALL_MUTATORS=uncovered
            | Qwen3.8-control:     --model Qwen3.8-27B-FP8
            | Qwen3.8-alfred:      --model Qwen3.8-27B-FP8 set:G2F_LLM_MODE=continuous set:G2F_STALL_MUTATORS=uncovered
            | afl: --afl
scheduler   = random
secs        = 21600
reps        = 3
seeds       = shared
name        = {arm}/{target}-r{rep}
max_seedgen = 4
gpu         = qc-h100
account     = priority-quantumcore
partition   = priority
output      = campaign
